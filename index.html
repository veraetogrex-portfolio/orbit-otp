<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit OTP — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Orbit OTP · zero dependencies · github.com/veraetogrex-portfolio -->
  <section class="otp" id="otp" aria-labelledby="otp-title">
    <p class="otp-kicker">Sign in</p>
    <h1 class="otp-title" id="otp-title">Verify it's you</h1>
    <p class="otp-sub">Enter the code we sent to <b>you@example.com</b></p>

    <div class="otp-row" aria-hidden="true">
      <div class="otp-cell"></div><div class="otp-cell"></div>
      <div class="otp-cell"></div><div class="otp-cell"></div>
    </div>
    <input class="otp-input" inputmode="numeric" autocomplete="one-time-code"
           maxlength="4" aria-label="4-digit code">

    <div class="otp-orbit" aria-hidden="true">
      <svg class="otp-ring" viewBox="-170 -170 340 340"><circle r="130"/><g class="otp-ticks"></g></svg>
      <div class="otp-dot"></div>
    </div>

    <div class="otp-ok" aria-hidden="true">
      <svg viewBox="0 0 76 76"><path d="M18 40 L32 53 L59 24" pathLength="100"/></svg>
    </div>

    <p class="otp-foot" role="status">Hint: the demo code is 4719</p>
    <button class="otp-continue" type="button">Continue →</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
